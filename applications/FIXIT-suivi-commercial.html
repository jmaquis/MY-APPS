'use strict';
const KEY='fixit-commercial-v1', $=s=>document.querySelector(s), TYPES=['Appel','Visite','Rendez-vous','Relance devis','Relance commande','Autre'], STATUSES=['Prospect','Client actif','Client inactif','À écarter'];
let state={version:1,contacts:[],tasks:[],orders:[],orderNotes:[],lastExport:null}, raw=null,blocked=false,tab='home',query='',filter='open',selected=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>localDate();
const when=t=>new Date(t.date+'T'+(t.time||'23:59'));
const late=t=>!t.done&&when(t)<new Date();
const dateLabel=d=>new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const getContact=id=>state.contacts.find(c=>c.id===id);
function validDate(d){return typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(new Date(d+'T12:00'))&&localDate(new Date(d+'T12:00'))===d}
function validateBase(v){if(!v||v.version!==1||!Array.isArray(v.contacts)||!Array.isArray(v.tasks)||v.contacts.length>30000||v.tasks.length>100000)throw Error('Format non reconnu');const str=(s,max=10000)=>typeof s==='string'&&s.length<=max;let ids=new Set();for(const c of v.contacts){if(!c||!str(c.id,200)||!c.id||ids.has(c.id)||!str(c.company,200)||!c.company.trim()||!STATUSES.includes(c.status)||!['person','trade','phone','email','address','notes'].every(k=>str(c[k])))throw Error('Fiche client invalide');ids.add(c.id)}let tasks=new Set();for(const t of v.tasks){if(!t||!str(t.id,200)||!t.id||tasks.has(t.id)||!ids.has(t.contactId)||!str(t.title,200)||!t.title.trim()||!TYPES.includes(t.type)||!validDate(t.date)||!(t.time===''||typeof t.time==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(t.time))||typeof t.done!=='boolean'||!str(t.notes)||!str(t.result)||!(t.completedAt===null||str(t.completedAt,100)&&!isNaN(Date.parse(t.completedAt))))throw Error('Action invalide');tasks.add(t.id)}if(!(v.lastExport===null||str(v.lastExport,100)&&!isNaN(Date.parse(v.lastExport))))throw Error('Date de sauvegarde invalide');return {version:1,contacts:v.contacts.map(c=>Object.fromEntries(['id','company','status','person','trade','phone','email','address','notes'].map(k=>[k,c[k]]))),tasks:v.tasks.map(t=>Object.fromEntries(['id','contactId','title','type','date','time','notes','done','result','completedAt'].map(k=>[k,t[k]]))),lastExport:v.lastExport}}
const ORDER_STATUSES=['Brouillon','À transmettre','Transmise'];
let orderClient='';
function validateWithOrders(v){const base=validateBase(v);const orders=v.orders===undefined?[]:v.orders;if(!Array.isArray(orders)||orders.length>10000)throw Error('Liste de commandes invalide');const ids=new Set(),numbers=new Set(),contacts=new Set(base.contacts.map(c=>c.id));const str=(v,n)=>typeof v==='string'&&v.length<=n;const num=(v,min,max)=>typeof v==='number'&&Number.isFinite(v)&&v>=min&&v<=max;const clean=[];for(const o of orders){if(!o||!str(o.id,200)||!o.id||ids.has(o.id)||!Number.isSafeInteger(o.number)||o.number<1||o.number>1e9||numbers.has(o.number)||!contacts.has(o.contactId)||!validDate(o.date)||!ORDER_STATUSES.includes(o.status)||!str(o.notes,100000)||!Array.isArray(o.lines)||(!o.lines.length&&!o.notes.trim())||o.lines.length>200)throw Error('Commande invalide');ids.add(o.id);numbers.add(o.number);const lines=o.lines.map(l=>{if(!l||!str(l.ref,200)||!str(l.label,500)||!l.label.trim()||!num(l.qty,0.001,1e6)||!(l.price===null||num(l.price,0,1e7)))throw Error('Article de commande invalide');return {ref:l.ref,label:l.label,qty:l.qty,price:l.price}});clean.push({id:o.id,number:o.number,contactId:o.contactId,date:o.date,status:o.status,notes:o.notes,lines})}return {...base,orders:clean}}
function validate(v){const base=validateWithOrders(v);const notes=v.orderNotes===undefined?legacyOrderNotes(base):v.orderNotes;if(!Array.isArray(notes)||notes.length>30000)throw Error('Notes de commande invalides');const ids=new Set(),contacts=new Set(base.contacts.map(c=>c.id));for(const n of notes){if(!n||!contacts.has(n.contactId)||ids.has(n.contactId)||typeof n.text!=='string'||n.text.length>100000)throw Error('Notes de commande invalides');ids.add(n.contactId)}return {...base,orderNotes:notes.map(n=>({contactId:n.contactId,text:n.text}))}}
function legacyOrderNotes(base){const grouped=new Map();for(const o of base.orders){const lines=['Commande CMD-'+String(o.number).padStart(4,'0')+' — '+o.date,...o.lines.map(l=>[l.qty+' × '+l.label,l.ref?'Réf. '+l.ref:'',l.price===null?'À chiffrer':l.price+' € HT / unité'].filter(Boolean).join(' · ')),o.notes].filter(Boolean).join('\n');grouped.set(o.contactId,[grouped.get(o.contactId),lines].filter(Boolean).join('\n\n'));}return [...grouped].map(([contactId,text])=>({contactId,text}))}
function orderNotesView(){if(!getContact(orderClient))orderClient='';return `<h1>Commandes</h1><section class="panel" style="margin-top:24px"><label>Client<select id="orderClient"><option value="">Choisir un client…</option>${[...state.contacts].sort((a,b)=>a.company.localeCompare(b.company,'fr')).map(c=>`<option value="${esc(c.id)}" ${c.id===orderClient?'selected':''}>${esc(c.company)}${c.person?' — '+esc(c.person):''}</option>`).join('')}</select></label><label>Notes de commande<textarea id="orderNotes" maxlength="100000" style="min-height:300px" placeholder="Note ici les articles, les quantités et les informations utiles…" ${orderClient?'':'disabled'}>${esc(state.orderNotes.find(n=>n.contactId===orderClient)?.text||'')}</textarea></label><div class="actions" style="margin-bottom:14px"><button class="primary" data-action="saveNoteOrder" ${orderClient?'':'disabled'}>Enregistrer</button></div><small id="orderSaveStatus" role="status">${!state.contacts.length?'Ajoute d’abord un client dans Clients & prospects.':orderClient?'Enregistrement automatique sur cet appareil.':'Choisis un client pour saisir ou retrouver ses notes.'}</small></section>${savedNoteOrders()}`}
function savedNoteOrders(){if(!orderClient)return '';const orders=state.orders.filter(o=>o.contactId===orderClient).sort((a,b)=>b.number-a.number);if(!orders.length)return '';return `<section style="margin-top:24px"><h2>Commandes enregistrées</h2>${orders.map(o=>`<article class="card"><div class="row"><strong>${esc(getContact(o.contactId).company)}</strong><small>${esc(dateLabel(o.date))}</small></div><p class="note">${esc(o.notes)}</p>${o.lines.length?`<p class="note muted">${esc(o.lines.map(l=>l.qty+' × '+l.label+(l.ref?' — '+l.ref:'')).join('\n'))}</p>`:''}<div class="actions"><button class="danger" data-action="deleteNoteOrder" data-id="${esc(o.id)}">Supprimer</button></div></article>`).join('')}</section>`}
function deleteNoteOrder(id){const o=state.orders.find(o=>o.id===id);if(!o)return;if(confirm('Supprimer définitivement cette commande pour '+getContact(o.contactId).company+' ?')&&update(s=>s.orders=s.orders.filter(o=>o.id!==id))){render();toast('Commande supprimée.')}}
function saveNoteOrder(){const text=$('#orderNotes').value;if(!getContact(orderClient)){toast('Choisis un client.');return}if(!text.trim()){toast('Ajoute les notes de ta commande avant d’enregistrer.');return}const order={id:uid(),number:Math.max(0,...state.orders.map(o=>o.number))+1,contactId:orderClient,date:today(),status:'Brouillon',notes:text,lines:[]};if(update(s=>{s.orders.push(order);s.orderNotes=s.orderNotes.filter(n=>n.contactId!==orderClient)})){render();toast('Commande pour '+getContact(order.contactId).company+' enregistrée.')}}
function saveOrderNotes(text){if(!orderClient)return;const ok=update(s=>{const i=s.orderNotes.findIndex(n=>n.contactId===orderClient);if(i<0)s.orderNotes.push({contactId:orderClient,text});else s.orderNotes[i].text=text});$('#orderSaveStatus').textContent=ok?'Notes enregistrées sur cet appareil.':'Échec de l’enregistrement. Garde une copie de tes notes.';}
try{raw=localStorage.getItem(KEY);if(raw!==null)state=validate(JSON.parse(raw));}catch(e){blocked=true;}
function commit(next){if(blocked){alert('Le stockage est indisponible ou illisible. Sauvegarde tes données avant de continuer.');return false}try{if(localStorage.getItem(KEY)!==raw){alert('Les données ont changé dans une autre fenêtre. Recharge cette page avant de continuer.');return false}const checked=validate(next);const json=JSON.stringify(checked);localStorage.setItem(KEY,json);raw=json;state=checked;return true}catch(e){alert('Enregistrement impossible : '+e.message+'. Tes modifications ne sont pas enregistrées.');return false}}
function update(fn){const next=structuredClone(state);fn(next);return commit(next)}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,3500)}
function switchTab(v){tab=v;query='';filter='open';render()}
function taskCard(t){const c=getContact(t.contactId);return `<article class="card"><div class="row"><div><div class="title">${esc(t.title)}</div><div class="contactline"><button data-action="detail" data-id="${esc(c.id)}" style="padding:0;border:0;color:var(--green);text-align:left">${esc(c.company)}</button> · ${esc(t.type)}</div></div><span class="badge ${late(t)?'late':''}">${t.done?'Terminé':late(t)?'En retard':'À faire'} · ${esc(dateLabel(t.date))}${t.time?' à '+esc(t.time):''}</span></div>${t.notes?`<p class="note muted">${esc(t.notes)}</p>`:''}${t.done&&t.result?`<p class="note">Compte rendu : ${esc(t.result)}</p>`:''}<div class="actions">${!t.done?`<button class="primary" data-action="complete" data-id="${esc(t.id)}">✓ Terminer</button>`:`<button data-action="reopen" data-id="${esc(t.id)}">Rouvrir</button>`}<button data-action="editTask" data-id="${esc(t.id)}">Modifier</button>${!t.done?`<button data-action="postpone" data-id="${esc(t.id)}">Reporter</button>`:''}<button data-action="calendar" data-id="${esc(t.id)}">Agenda (.ics)</button><button class="danger" data-action="deleteTask" data-id="${esc(t.id)}">Supprimer</button></div></article>`}
function listTasks(ts){return ts.length?ts.map(taskCard).join(''):'<div class="empty">Aucune action dans cette vue.</div>'}
function sorted(ts){return [...ts].sort((a,b)=>when(a)-when(b))}
function render(){const tabs=[['home','Vue du jour'],['tasks','Agenda & relances'],['contacts','Clients & prospects'],['orders','Commandes'],['backup','Sauvegarde & aide']];$('#nav').innerHTML=tabs.map(([v,l])=>`<button data-tab="${v}" class="${tab===v?'active':''}" ${tab===v?'aria-current="page"':''}>${l}</button>`).join('');$('#dateNow').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});$('#warning').innerHTML=blocked?'<div class="notice">Stockage indisponible ou données illisibles. Les écritures sont bloquées pour protéger les données existantes. Tu peux exporter le contenu brut depuis Sauvegarde & aide.</div>':'';let open=sorted(state.tasks.filter(t=>!t.done));let content='';
if(tab==='home'){const overdue=open.filter(late),due=open.filter(t=>t.date===today()),upcoming=open.filter(t=>t.date>today()),noAction=state.contacts.filter(c=>c.status!=='À écarter'&&!open.some(t=>t.contactId===c.id));content=`<h1>Chaque contact, une prochaine action.</h1><div class="muted">Ton suivi de terrain, au même endroit.</div><div class="toolbar"><div><button class="primary" data-action="newTask">+ Planifier une action</button> <button data-action="newContact">+ Ajouter un contact</button></div></div><div class="stats"><button class="stat late" data-view="late"><span>EN RETARD</span><strong>${overdue.length}</strong><span>Actions à reprendre</span></button><button class="stat" data-view="today"><span>AUJOURD’HUI</span><strong>${due.length}</strong><span>Rendez-vous et relances</span></button><button class="stat" data-view="future"><span>À VENIR</span><strong>${upcoming.length}</strong><span>Actions planifiées</span></button><button class="stat" data-tab="contacts"><span>PORTEFEUILLE</span><strong>${state.contacts.length}</strong><span>Clients et prospects</span></button></div><div class="layout"><div><h2>À traiter en priorité</h2>${listTasks([...overdue,...due.filter(t=>!late(t))])}</div><div><section class="panel"><h2>Prochains rendez-vous</h2>${listTasks(upcoming.filter(t=>['Visite','Rendez-vous'].includes(t.type)).slice(0,3))}</section><section class="panel" style="margin-top:18px"><h2>Sans prochaine action <span class="badge">${noAction.length}</span></h2><p class="muted">Une fiche seule ne fait pas avancer une vente. Donne une date au prochain contact utile.</p>${noAction.slice(0,6).map(c=>`<div class="contactline"><button data-action="detail" data-id="${esc(c.id)}">${esc(c.company)}</button></div>`).join('')||'<small>Tous tes contacts suivis ont une action prévue.</small>'}</section></div></div>`}
if(tab==='tasks')content=`<h1>Agenda & relances</h1><div class="muted">Les actions sont classées par échéance.</div><div class="toolbar"><input id="search" aria-label="Rechercher une action ou une entreprise" placeholder="Rechercher une action, une entreprise…" value="${esc(query)}"><select id="filter" aria-label="Filtrer les actions" style="width:auto">${[['open','À faire'],['late','En retard'],['today','Aujourd’hui'],['future','À venir'],['done','Terminées'],['all','Toutes']].map(([v,l])=>`<option value="${v}" ${filter===v?'selected':''}>${l}</option>`).join('')}</select><button class="primary" data-action="newTask">+ Planifier une action</button></div><div id="results"></div>`;
if(tab==='contacts')content=`<h1>Clients & prospects</h1><div class="muted">Les coordonnées, les notes et l’historique de chaque relation.</div><div class="toolbar"><input id="search" aria-label="Rechercher un contact" placeholder="Entreprise, ville, métier, contact…" value="${esc(query)}"><button class="primary" data-action="newContact">+ Ajouter un contact</button></div><div id="results"></div>`;
if(tab==='orders')content=orderNotesView();
if(tab==='backup')content=`<h1>Sauvegarde & aide</h1><div class="layout" style="margin-top:24px"><section class="panel"><h2>Garde une copie de ton suivi</h2><p>Les données sont enregistrées dans le navigateur de cet appareil. Effacer ses données, utiliser la navigation privée ou déplacer ce fichier peut te faire perdre l’accès au suivi. Garde le fichier au même emplacement.</p><div class="notice">Télécharge une sauvegarde JSON régulièrement et garde-la dans un dossier sûr. Le fichier HTML seul ne contient pas tes clients ni tes commandes.</div><p><strong>Dernier export demandé :</strong> ${state.lastExport?esc(new Date(state.lastExport).toLocaleString('fr-FR')):'Aucun'}</p><small>Vérifie que le fichier a bien été téléchargé avant de fermer.</small><div class="actions"><button class="primary" data-action="export">Télécharger la sauvegarde JSON</button><button data-action="import">Restaurer une sauvegarde</button>${blocked?'<button data-action="rawExport">Exporter les données brutes</button>':''}</div><p class="muted">La restauration remplace tout le suivi après confirmation. Fais un export avant de restaurer.</p></section><section class="panel"><h2>Utilisation simple</h2><p>1. Ajoute une entreprise et ses coordonnées.<br>2. Planifie un appel, une visite ou une relance.<br>3. Après l’échange, termine l’action, note le résultat et prévois la suite.<br>4. Exporte une sauvegarde en fin de journée.</p><h2>Commandes</h2><p>Choisis un client et saisis ses notes de commande. Les notes en cours s’enregistrent automatiquement. Le bouton Enregistrer crée une commande distincte et libère la zone de saisie. Les commandes sont incluses dans la sauvegarde JSON. Les notes sont distinctes pour chaque client. Les anciennes commandes sont reprises sous forme de texte.</p><h2>Ouvrir l’outil</h2><p>Sur ordinateur, télécharge ce fichier HTML et ouvre-le dans un navigateur récent. Aucun serveur ni connexion nécessaire. Sur téléphone, l’ouverture des fichiers HTML dépend du navigateur et du gestionnaire de fichiers ; un aperçu de document peut bloquer l’application.</p><h2>Rappels</h2><p>Les retards sont signalés à l’ouverture. Pour une alarme lorsque l’outil est fermé, utilise « Agenda (.ics) » puis importe le fichier dans ton calendrier. Vérifie l’heure et le rappel dans ce calendrier.</p><p class="muted">Pas de compte, pas d’envoi de données, pas de synchronisation automatique. Ce fichier ne chiffre pas les données enregistrées dans le navigateur. Sauvegarde puis restaure pour changer d’appareil.</p></section></div>`;
$('#app').innerHTML=content;renderResults()}
function renderResults(){const target=$('#results');if(!target)return;const q=query.toLocaleLowerCase('fr');if(tab==='tasks'){let ts=sorted(state.tasks).filter(t=>{const text=[t.title,t.notes,getContact(t.contactId)?.company].join(' ').toLocaleLowerCase('fr');return text.includes(q)&&(filter==='all'||filter==='done'&&t.done||filter==='open'&&!t.done||filter==='late'&&late(t)||filter==='today'&&!t.done&&t.date===today()||filter==='future'&&!t.done&&t.date>today())});target.innerHTML=listTasks(ts)}else{const cs=[...state.contacts].sort((a,b)=>a.company.localeCompare(b.company,'fr')).filter(c=>[c.company,c.person,c.address,c.trade,c.phone].join(' ').toLocaleLowerCase('fr').includes(q));target.innerHTML=cs.map(c=>{const next=sorted(state.tasks.filter(t=>t.contactId===c.id&&!t.done))[0];return `<article class="card"><div class="row"><div><div class="title">${esc(c.company)}</div><div class="contactline muted">${esc([c.person,c.trade,c.address].filter(Boolean).join(' · '))}</div></div><span class="badge">${esc(c.status)}</span></div>${next?`<small>Prochaine action : ${esc(next.title)} · ${esc(dateLabel(next.date))}</small>`:'<small>Aucune prochaine action</small>'}<div class="actions"><button class="primary" data-action="detail" data-id="${esc(c.id)}">Ouvrir la fiche</button><button data-action="contactTask" data-id="${esc(c.id)}">+ Action</button></div></article>`}).join('')||'<div class="empty">Aucun contact. Ajoute ta première entreprise pour commencer.</div>'}}
function show(html){const d=$('#modal');if(d.open)d.close();d.classList.remove('orderdialog');d.innerHTML=`<div class="dialoghead"><span></span><button data-action="close" aria-label="Fermer">×</button></div>`+html;d.showModal()}
function input(label,name,value='',type='text',required=false){return `<label>${label}<input name="${name}" type="${type}" maxlength="${name==='company'||name==='title'?200:10000}" value="${esc(value)}" ${required?'required':''}></label>`}
function contactForm(id){const c=getContact(id)||{status:'Prospect'};show(`<h2>${id?'Modifier le contact':'Nouveau contact'}</h2><form id="contactForm" data-id="${esc(id||'')}"><div class="fields">${input('Entreprise *','company',c.company,'text',true)}${input('Interlocuteur','person',c.person)}${input('Métier','trade',c.trade)}<label>Statut<select name="status">${STATUSES.map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select></label>${input('Téléphone','phone',c.phone,'tel')}${input('E-mail','email',c.email,'email')}<div class="wide">${input('Adresse / ville','address',c.address)}</div><label class="wide">Notes<textarea name="notes" maxlength="10000">${esc(c.notes)}</textarea></label></div><button class="primary" type="submit">Enregistrer le contact</button></form>`)}
function taskForm(id,contactId){if(!state.contacts.length){toast('Ajoute d’abord un contact.');contactForm();return}const t=state.tasks.find(t=>t.id===id)||{contactId:contactId||state.contacts[0].id,type:'Appel',date:today(),time:''};show(`<h2>${id?'Modifier l’action':'Planifier une action'}</h2><form id="taskForm" data-id="${esc(id||'')}"><div class="fields"><label>Entreprise *<select name="contactId" required>${[...state.contacts].sort((a,b)=>a.company.localeCompare(b.company,'fr')).map(c=>`<option value="${esc(c.id)}" ${c.id===t.contactId?'selected':''}>${esc(c.company)}</option>`).join('')}</select></label><label>Type<select name="type">${TYPES.map(s=>`<option ${s===t.type?'selected':''}>${s}</option>`).join('')}</select></label><div class="wide">${input('Objet / prochaine action *','title',t.title,'text',true)}</div>${input('Date *','date',t.date,'date',true)}${input('Heure (facultative)','time',t.time,'time')}<label class="wide">Notes / préparation<textarea name="notes" maxlength="10000">${esc(t.notes)}</textarea></label></div><button class="primary" type="submit">Enregistrer l’action</button></form>`)}
function detail(id){const c=getContact(id);selected=id;const ts=sorted(state.tasks.filter(t=>t.contactId===id));show(`<h2>${esc(c.company)}</h2><span class="badge">${esc(c.status)}</span><p>${esc(c.person)}${c.trade?' · '+esc(c.trade):''}</p><div class="contactline">${esc(c.phone)} ${c.phone&&/^[+\d\s().-]+$/.test(c.phone)?`<a href="tel:${esc(c.phone.replace(/[^+\d]/g,''))}">Appeler</a>`:''}</div><div class="contactline">${esc(c.email)} ${c.email&&/^[^\s@]+@[^\s@]+$/.test(c.email)?`<a href="mailto:${encodeURIComponent(c.email)}">Écrire</a>`:''}</div><div class="contactline">${esc(c.address)}</div><p class="note">${esc(c.notes)}</p><div class="actions"><button class="primary" data-action="contactTask" data-id="${esc(id)}">+ Prochaine action</button><button data-action="editContact" data-id="${esc(id)}">Modifier</button><button class="danger" data-action="deleteContact" data-id="${esc(id)}">Supprimer la fiche</button></div><h2 style="margin-top:28px">Actions & historique</h2>${listTasks(ts)}`)}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function exportData(){download('FIXIT-sauvegarde-'+today()+'.json',JSON.stringify(state,null,2),'application/json');if(!blocked)update(s=>s.lastExport=new Date().toISOString());render();toast('Export demandé. Vérifie ton dossier Téléchargements.');}
function icsText(s){return s.replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,')}
function fold(line){let out='',chunk='',bytes=0;for(const c of line){const n=new TextEncoder().encode(c).length;if(bytes+n>73){out+=chunk+'\r\n ';chunk='';bytes=1}chunk+=c;bytes+=n}return out+chunk}
function calendar(t){const c=getContact(t.contactId);let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FIXIT Suivi Local//FR','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+t.id+'@fixit-local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')];if(t.time){const start=when(t),end=new Date(start.getTime()+3600000),utc=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');lines.push('DTSTART:'+utc(start),'DTEND:'+utc(end),'BEGIN:VALARM','TRIGGER:-PT15M','ACTION:DISPLAY','DESCRIPTION:Rappel','END:VALARM')}else{let end=new Date(t.date+'T12:00');end.setDate(end.getDate()+1);lines.push('DTSTART;VALUE=DATE:'+t.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+localDate(end).replace(/-/g,''))}lines.push('SUMMARY:'+icsText(c.company+' — '+t.title),'DESCRIPTION:'+icsText(t.notes),'LOCATION:'+icsText(c.address),'END:VEVENT','END:VCALENDAR');download('FIXIT-rendez-vous.ics',lines.map(fold).join('\r\n')+'\r\n','text/calendar;charset=utf-8');toast('Fichier agenda créé. Importe-le dans ton calendrier.');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){switchTab(b.dataset.tab);return}if(b.dataset.view){tab='tasks';query='';filter=b.dataset.view;render();return}const id=b.dataset.id,t=state.tasks.find(t=>t.id===id);switch(b.dataset.action){case 'saveNoteOrder':saveNoteOrder();break;case 'deleteNoteOrder':deleteNoteOrder(id);break;case 'close':$('#modal').close();break;case 'newContact':contactForm();break;case 'editContact':contactForm(id);break;case 'newTask':taskForm();break;case 'contactTask':taskForm(null,id);break;case 'editTask':taskForm(id);break;case 'detail':detail(id);break;case 'complete':show(`<h2>Terminer l’action</h2><p>${esc(t.title)}</p><form id="completeForm" data-id="${esc(id)}"><label>Résultat de l’échange<textarea name="result" maxlength="10000" placeholder="Besoin identifié, réponse du client, accord…"></textarea></label><label><input type="checkbox" name="next" checked style="width:auto"> Prévoir une prochaine action après validation</label><button class="primary">Terminer</button></form>`);break;case 'reopen':if(update(s=>{const x=s.tasks.find(t=>t.id===id);x.done=false;x.completedAt=null})){if($('#modal').open)detail(t.contactId);render()}break;case 'postpone':show(`<h2>Reporter l’action</h2><form id="postponeForm" data-id="${esc(id)}">${input('Nouvelle date *','date',t.date,'date',true)}${input('Heure','time',t.time,'time')}<button class="primary">Enregistrer</button></form>`);break;case 'deleteTask':if(confirm('Supprimer définitivement cette action ?')&&update(s=>s.tasks=s.tasks.filter(t=>t.id!==id))){if($('#modal').open)detail(t.contactId);render()}break;case 'deleteContact':if(state.orders.some(o=>o.contactId===id)){alert('Ce client est lié à des commandes. Conserve sa fiche pour garder leur historique.');break}if(confirm('Supprimer cette entreprise ainsi que toutes ses actions, ses notes de commande et son historique ?')&&update(s=>{s.contacts=s.contacts.filter(c=>c.id!==id);s.tasks=s.tasks.filter(t=>t.contactId!==id);s.orderNotes=s.orderNotes.filter(n=>n.contactId!==id)})){$('#modal').close();render()}break;case 'calendar':calendar(t);break;case 'export':exportData();break;case 'rawExport':download('FIXIT-donnees-brutes.txt',raw||'Aucune donnée accessible','text/plain');break;case 'import':$('#importFile').value='';$('#importFile').click();break;}});
document.addEventListener('input',e=>{if(e.target.id==='orderNotes')saveOrderNotes(e.target.value);if(e.target.id==='search'){query=e.target.value;renderResults()}});document.addEventListener('change',e=>{if(e.target.id==='orderClient'){orderClient=e.target.value;render();return}if(e.target.id==='filter'){filter=e.target.value;renderResults()}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,fd=new FormData(form),id=form.dataset.id,data=Object.fromEntries(fd);if(form.id==='contactForm'){data.company=data.company.trim();if(!data.company){toast('Indique le nom de l’entreprise.');return}if(update(s=>{if(id)Object.assign(s.contacts.find(c=>c.id===id),data);else s.contacts.push({id:uid(),...data})})){$('#modal').close();render();toast('Contact enregistré.')}}if(form.id==='taskForm'){data.title=data.title.trim();if(!data.title){toast('Indique l’objet de l’action.');return}if(update(s=>{if(id)Object.assign(s.tasks.find(t=>t.id===id),data);else s.tasks.push({id:uid(),...data,done:false,result:'',completedAt:null})})){$('#modal').close();render();toast('Action enregistrée.')}}if(form.id==='completeForm'){const contactId=state.tasks.find(t=>t.id===id).contactId;if(update(s=>Object.assign(s.tasks.find(t=>t.id===id),{done:true,result:data.result,completedAt:new Date().toISOString()}))){$('#modal').close();render();if(fd.has('next'))taskForm(null,contactId);else toast('Action terminée.')}}if(form.id==='postponeForm'){if(update(s=>Object.assign(s.tasks.find(t=>t.id===id),data))){$('#modal').close();render();toast('Échéance modifiée.')}}});
$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>20000000)throw Error('Fichier trop volumineux (20 Mo maximum)');const imported=validate(JSON.parse(await f.text()));if(blocked){alert('Stockage bloqué : la restauration ne peut pas être enregistrée. Essaie un navigateur autorisant le stockage local.');return}if(!confirm(`Remplacer tout le suivi par ${imported.contacts.length} contacts et ${imported.tasks.length} actions et ${imported.orders.length} commandes et ${imported.orderNotes.length} fiches de notes de commande ? Exporte d’abord les données actuelles si tu veux les conserver.`))return;if(commit(imported)){render();toast('Sauvegarde restaurée.')}}catch(err){alert('Import refusé : '+err.message+'. Les données actuelles sont conservées.')}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue!==raw)toast('Suivi modifié dans une autre fenêtre. Recharge cette page.');});
render();setInterval(()=>{if(!$('#modal').open&&(tab==='home'||tab==='tasks')&&document.activeElement?.id!=='search')render()},60000);
</script></body></html>
