<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes notes</title>
<style>
  :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; color: #f4f6fb; background: #11151e; }
  body { margin: 0; }
  main { box-sizing: border-box; width: min(720px, 100%); margin: 0 auto; padding: clamp(24px, 7vw, 70px) 24px; }
  h1 { margin: 0 0 28px; font-size: clamp(38px, 8vw, 60px); letter-spacing: -.045em; }
  label { display: block; margin: 0 0 10px; color: #b4bed2; }
  textarea { display: block; box-sizing: border-box; width: 100%; min-height: 240px; resize: vertical; padding: 20px;
    border: 1px solid #47536b; border-radius: 12px; background: #202736; color: inherit; font: inherit; line-height: 1.55; }
  textarea:focus-visible { outline: 2px solid #bef264; outline-offset: 3px; }
  output { display: block; margin: 12px 0; color: #bef264; }
  button { padding: 10px 14px; border: 1px solid #aa696e; border-radius: 9px;
    background: #3e252d; color: #ffd9dc; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { background: #55313b; }
  button:focus-visible { outline: 2px solid #bef264; outline-offset: 3px; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main>
  <h1>Mes notes</h1>
  <label for="note">Note de démonstration</label>
  <textarea id="note" placeholder="Écris une note…" aria-describedby="status"></textarea>
  <output id="status" for="note" aria-live="polite">Enregistrement automatique sur cet appareil</output>
  <button id="delete-note" type="button" disabled>Supprimer la note</button>
</main>
<script>
  const note = document.querySelector('#note');
  const status = document.querySelector('#status');
  const deleteButton = document.querySelector('#delete-note');
  const key = 'my-apps.mes-notes-demo.note';

  try {
    note.value = localStorage.getItem(key) ?? '';
    deleteButton.disabled = !note.value;
  } catch {
    status.value = 'Le stockage local est indisponible.';
  }

  note.addEventListener('input', () => {
    deleteButton.disabled = !note.value;
    try {
      localStorage.setItem(key, note.value);
      status.value = note.value ? 'Note enregistrée' : 'Note effacée';
    } catch {
      status.value = 'Impossible d’enregistrer la note dans ce navigateur.';
    }
  });

  deleteButton.addEventListener('click', () => {
    if (!note.value || !window.confirm('Supprimer cette note ?')) return;

    try {
      localStorage.removeItem(key);
    } catch {
      status.value = 'Impossible de supprimer la note dans ce navigateur.';
      return;
    }

    note.value = '';
    deleteButton.disabled = true;
    status.value = 'Note supprimée';
    note.focus();
  });
</script>
</body>
</html>
