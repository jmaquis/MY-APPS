</style></head><body><div class="shell"><aside><div><div class="brand">octane<b>®</b></div><div class="tag muted" style="margin-top:8px">Votre carnet de route</div></div><nav id="nav"></nav><div class="asidefoot"><span class="dot"></span>Données sur cet appareil<br>Pas de compte. Pas de cloud.<br><span class="muted">Une route bien suivie.</span></div></aside><main><div class="top"><div class="tag muted" id="today"></div><span class="pill"><span class="dot"></span>100 % local · hors ligne</span></div><div id="app"></div></main></div><dialog id="modal"><div class="dialoghead"><h2 id="mtitle"></h2><button class="iconbtn" onclick="closeModal()" aria-label="Fermer">✕</button></div><form id="form"><div class="formgrid" id="fields"></div><div class="dialogfoot"><button type="button" class="btn light" onclick="closeModal()">Annuler</button><button class="btn" type="submit">Enregistrer</button></div></form></dialog><input hidden type="file" id="restore" accept="application/json,.json"><input hidden type="file" id="documentFile" accept="application/pdf,image/jpeg,image/png,image/webp,.pdf,.jpg,.jpeg,.png,.webp"><dialog id="docViewer"><div class="dialoghead"><h2 id="docTitle">Document</h2><button class="iconbtn" onclick="closeDocument()" aria-label="Fermer le document">✕</button></div><div id="docContent"></div><p class="sectionnote">Si le PDF ne s’affiche pas, téléchargez-le pour l’ouvrir dans votre lecteur habituel.</p><button class="btn" id="docDownload">Télécharger</button></dialog><div id="toast" role="status"></div><script>

const KEY='octane.local.v1', $=s=>document.querySelector(s), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), num=n=>Number(n||0).toLocaleString('fr-FR',{maximumFractionDigits:2}), money=n=>num(n)+' €', day=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}, date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('fr-FR'):'Sans date';
let state={version:1,vehicle:{name:'Mon véhicule',plate:'',fuel:'Essence',km:0},entries:[],reminders:[]}, page='home', storageOK=true, loadError=false, search='', filter='all';
function validDocs(d){return d===undefined||(Array.isArray(d)&&d.length<=100&&new Set(d.map(x=>x.id)).size===d.length&&d.every(x=>x&&typeof x.id==='string'&&/^[a-zA-Z0-9_-]+$/.test(x.id)&&typeof x.name==='string'&&x.name.length<=200&&typeof x.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&Number.isInteger(x.size)&&x.size>0&&x.size<=1572864&&['application/pdf','image/jpeg','image/png','image/webp'].includes(x.mime)&&typeof x.data==='string'&&x.data.startsWith('data:'+x.mime+';base64,')&&/^[A-Za-z0-9+/]+={0,2}$/.test(x.data.split(',')[1])&&Math.floor(x.data.split(',')[1].length*3/4)-(x.data.endsWith('==')?2:x.data.endsWith('=')?1:0)===x.size)&&d.reduce((n,x)=>n+x.size,0)<=2097152)}
function valid(s){if(!s||!validDocs(s.documents)||s.version!==1||!s.vehicle||typeof s.vehicle.name!=='string'||typeof s.vehicle.plate!=='string'||typeof s.vehicle.fuel!=='string'||!Number.isFinite(s.vehicle.km)||s.vehicle.km<0||!Array.isArray(s.entries)||!Array.isArray(s.reminders))return false;const ds=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&!isNaN(new Date(x+'T12:00:00')),n=x=>typeof x==='number'&&Number.isFinite(x)&&x>=0,txt=x=>typeof x==='string'&&x.length<20000;return s.entries.every(e=>txt(e.id)&&/^[a-zA-Z0-9_-]+$/.test(e.id)&&['fuel','service','other'].includes(e.type)&&ds(e.date)&&txt(e.title)&&txt(e.notes)&&n(e.km)&&n(e.cost)&&n(e.liters)&&typeof e.full==='boolean'&&txt(e.energy))&&s.reminders.every(r=>txt(r.id)&&/^[a-zA-Z0-9_-]+$/.test(r.id)&&txt(r.title)&&txt(r.notes)&&(!r.date||ds(r.date))&&(r.km===null||n(r.km))&&(r.date||r.km!==null)&&typeof r.done==='boolean')&&new Set(s.entries.map(e=>e.id)).size===s.entries.length&&new Set(s.reminders.map(e=>e.id)).size===s.reminders.length}
try{let s=localStorage.getItem(KEY);if(s){let p=JSON.parse(s);if(!valid(p))throw Error();state=p}localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOK=false;loadError=true}
function save(next){try{localStorage.setItem(KEY,JSON.stringify(next));state=next;storageOK=true;return true}catch(e){toast('Enregistrement impossible : exporte une sauvegarde et vérifie le stockage du navigateur.');return false}}
function toast(s){$('#toast').textContent=s;clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').textContent='',4500)}
function closeModal(){$('#modal').close()}
function currentKm(){return Math.max(state.vehicle.km,...state.entries.map(e=>e.km))}
function status(r){if(r.done)return {cls:'',label:'Effectué',rank:3};let days=r.date?Math.round((new Date(r.date+'T12:00:00')-new Date(day()+'T12:00:00'))/86400000):Infinity, km=r.km===null?Infinity:r.km-currentKm();if(days<0||km<0)return {cls:'red',label:'En retard',rank:0};if(days===0||km===0)return {cls:'red',label:'À faire maintenant',rank:0};if(days<=30||km<=1000)return {cls:'amber',label:'À prévoir',rank:1};return {cls:'',label:'Planifié',rank:2}}
function consumption(){if(state.vehicle.fuel==='GPL'||state.vehicle.fuel==='Électrique')return null;let a=state.entries.filter(e=>e.type==='fuel'&&e.energy===state.vehicle.fuel).sort((a,b)=>a.km-b.km||a.date.localeCompare(b.date));let base=null,liters=0,dist=0,total=0;for(let e of a){if(base!==null)liters+=e.liters;if(e.full){if(base!==null&&e.km>base){dist+=e.km-base;total+=liters}base=e.km;liters=0}}return dist?total/dist*100:null}

function entryRow(e){return `<div class="row"><div class="wrap"><span class="badge">${e.type==='fuel'?'Plein · '+esc(e.energy):e.type==='service'?'Entretien':'Autre dépense'}</span><strong>${esc(e.title)}</strong><small>${date(e.date)} · ${num(e.km)} km${e.type==='fuel'?' · '+num(e.liters)+' L':''}</small>${e.notes?`<p class="sectionnote">${esc(e.notes)}</p>`:''}</div><div style="text-align:right;flex-shrink:0"><strong>${money(e.cost)}</strong><div class="actions" style="margin-top:9px"><button class="iconbtn" onclick="editEntry('${e.id}')">Modifier</button><button class="iconbtn" onclick="removeItem('entries','${e.id}')" aria-label="Supprimer l’opération">✕</button></div></div></div>`}

function render(){ $('#today').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('#nav').innerHTML=tabs.map(t=>`<button class="${page===t[0]?'active':''}" onclick="go('${t[0]}')"><span>${t[1]}</span> ${t[2]}</button>`).join('');let html='', entries=[...state.entries].sort((a,b)=>b.date.localeCompare(a.date)||b.km-a.km), reminders=[...state.reminders].sort((a,b)=>status(a).rank-status(b).rank||(a.date||'9999').localeCompare(b.date||'9999')),month=day().slice(0,7),monthly=entries.filter(e=>e.date.startsWith(month)).reduce((s,e)=>s+e.cost,0), c=consumption();
if(page==='home'){html=heading('Prenez la route, sereinement.','Votre véhicule. Son histoire. Rien d’oublié.',addBtn)+`<section class="hero"><div><div class="tag" style="color:#d9ef81">Votre garage personnel</div><h2>${esc(state.vehicle.name)}</h2><span class="pill">${esc(state.vehicle.plate)||'Immatriculation à renseigner'} · ${esc(state.vehicle.fuel)}</span><div class="bigkm">${num(currentKm())} <small>km</small></div><button class="btn lime" onclick="editVehicle()">${state.vehicle.name==='Mon véhicule'?'Configurer mon véhicule':'Mettre à jour le kilométrage'} ↗</button></div>${car}</section><div class="stats"><div class="card stat"><small>Dépenses ce mois-ci</small><strong>${money(monthly)}</strong><small>Pleins et entretien inclus</small></div><div class="card stat"><small>Consommation calculée</small><strong>${c===null?'—':num(c.toFixed(1))+' <small>L/100</small>'}</strong><small>${c===null?'Deux pleins complets requis*':'Méthode plein à plein*'}</small></div><div class="card stat"><small>Échéances à surveiller</small><strong>${reminders.filter(r=>!r.done&&status(r).rank<=1).length}</strong><small>Sous 30 jours ou 1 000 km</small></div></div><div class="grid"><section class="card"><div class="listhead"><h2>Prochains rendez-vous</h2><button class="iconbtn" onclick="editReminder()">＋</button></div>${reminders.filter(r=>!r.done).slice(0,3).map(reminderRow).join('')||'<div class="empty">Votre prochaine révision ? Votre contrôle technique ?<br>Ajoutez une échéance pour garder le cap.</div><button class="btn light" onclick="editReminder()">Créer un rappel</button>'}</section><section class="card"><div class="listhead"><h2>Dernières opérations</h2><button class="iconbtn" onclick="go(\'entries\')">Tout voir ↗</button></div>${entries.slice(0,3).map(entryRow).join('')||'<div class="empty">Une histoire qui commence ici.<br>Enregistrez votre premier plein ou entretien.</div><button class="btn light" onclick="editEntry()">Ma première opération</button>'}</section></div><p class="sectionnote">* Tous les pleins intermédiaires doivent être saisis. Calcul séparé par carburant ; non proposé pour le GPL bicarburation et les véhicules électriques.</p>`}

if(page==='reminders')html=heading('Un temps d’avance.','Les dates et kilomètres qui comptent.',`<button class="btn" onclick="editReminder()">＋ Échéance</button>`)+`<div class="notice">Rappels visibles à l’ouverture de l’application. Le bouton « Agenda » exporte un événement avec une alerte à 7 jours ; importez-le dans votre calendrier et vérifiez que ses notifications sont activées. Saisissez la date du contrôle technique figurant sur vos documents.</div><section class="card">${reminders.map(reminderRow).join('')||'<div class="empty">Aucune échéance. Ajoutez votre contrôle technique, une vidange ou le remplacement des pneus.</div>'}</section><p class="sectionnote">Une échéance est signalée dès que la date OU le kilométrage est atteint. « Fait » clôture le rappel ; créez la prochaine échéance selon les préconisations de votre véhicule.</p>`;
if(page==='documents')html=heading('Vos documents à portée de main.','Factures, contrôle technique et justificatifs.',`<button class="btn" onclick="addDocument()">＋ Document</button>`)+`<section class="card">${(state.documents||[]).map(d=>`<div class="row"><div class="wrap"><span class="badge">${d.mime==='application/pdf'?'PDF':'Image'}</span><strong>${esc(d.name)}</strong><small>Ajouté le ${date(d.date)} · ${num(Math.round(d.size/1024))} Ko</small></div><div class="actions"><button class="iconbtn" onclick="openDocument('${d.id}')">Ouvrir</button><button class="iconbtn" onclick="downloadDocument('${d.id}')">Télécharger</button><button class="iconbtn" onclick="removeItem('documents','${d.id}')" aria-label="Supprimer le document">✕</button></div></div>`).join('')||'<div class="empty">Conservez ici vos justificatifs PDF et vos photos de factures.</div>'}</section><p class="sectionnote">PDF, JPG, PNG ou WebP. Maximum 1,5 Mo par fichier et 2 Mo de documents au total pour préserver le stockage local. Les documents sont inclus dans les sauvegardes JSON. Espace utilisé : ${num(((state.documents||[]).reduce((n,d)=>n+d.size,0)/1048576).toFixed(2))} / 2 Mo.</p>`;
if(page==='budget'){let total=entries.reduce((s,e)=>s+e.cost,0),fuel=entries.filter(e=>e.type==='fuel').reduce((s,e)=>s+e.cost,0);let months=Array.from({length:6},(_,i)=>{let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);let key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return {label:d.toLocaleDateString('fr-FR',{month:'short'}),v:entries.filter(e=>e.date.startsWith(key)).reduce((s,e)=>s+e.cost,0)}}),max=Math.max(1,...months.map(m=>m.v));html=heading('Le coût de la route.','Vos dépenses réelles, en toute clarté.')+`<div class="stats"><div class="card stat"><small>Total enregistré</small><strong>${money(total)}</strong></div><div class="card stat"><small>Carburant</small><strong>${money(fuel)}</strong></div><div class="card stat"><small>Entretien & autres</small><strong>${money(total-fuel)}</strong></div></div><section class="card"><h2>Les 6 derniers mois</h2>${months.map(m=>`<div class="barrow"><span>${m.label}</span><div class="bar"><i style="width:${m.v/max*100}%"></i></div><strong>${money(m.v)}</strong></div>`).join('')}</section><p class="sectionnote">Les totaux incluent uniquement les opérations que vous avez enregistrées.</p>`}
if(page==='settings')html=heading('Votre espace personnel.','Un carnet qui reste entre vos mains.')+`<div class="grid"><section class="card"><h2>${esc(state.vehicle.name)}</h2><p>${esc(state.vehicle.plate)||'Immatriculation non renseignée'} · ${esc(state.vehicle.fuel)}</p><div class="bigkm">${num(currentKm())} km</div><button class="btn" onclick="editVehicle()">Modifier le véhicule</button></section><section class="card"><h2>Vos données, à l’abri</h2><p class="muted">Exportez régulièrement une sauvegarde JSON. Elle permet de retrouver votre carnet après un changement d’appareil.</p><div class="actions" style="margin-top:18px"><button class="btn" onclick="backup()">↓ Sauvegarder</button><button class="btn light" onclick="document.querySelector('#restore').click()">↑ Restaurer</button></div></section><section class="card full"><h2>Comment utiliser votre carnet</h2><p>1. Renseignez votre véhicule et son kilométrage.<br>2. Ajoutez les pleins, entretiens et dépenses au fil de vos déplacements.<br>3. Programmez vos échéances par date et/ou kilométrage.</p><p class="sectionnote">Tout fonctionne hors ligne, sans transmission de vos données. Le stockage dépend du navigateur et de l’emplacement du fichier : utilisez toujours le même fichier et le même navigateur. La navigation privée, l’effacement des données ou le déplacement du fichier peuvent faire perdre l’accès au carnet. Exportez une sauvegarde avant tout changement.</p><p class="sectionnote">Sur mobile, téléchargez le fichier et ouvrez-le dans un navigateur capable d’exécuter les fichiers HTML locaux. Certains aperçus de fichiers, notamment sur iPhone, n’exécutent pas l’application. L’ajout à l’écran d’accueil et les notifications automatiques ne sont pas garantis pour un fichier local.</p><div class="actions" style="margin-top:16px"><button class="btn light" onclick="window.print()">Imprimer cette page</button></div></section></div>`;
$('#app').innerHTML=(!storageOK?'<div class="notice">Le stockage local est indisponible ou les données existantes sont illisibles. Aucun ancien contenu n’a été écrasé. Changez de navigateur ou restaurez une sauvegarde valide avant de saisir des opérations.</div>':'')+html;if(page==='entries')renderList()}
function renderList(){$('#entrylist').innerHTML=[...state.entries].filter(e=>(filter==='all'||e.type===filter)&&(e.title+' '+e.notes).toLowerCase().includes(search.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date)||b.km-a.km).map(entryRow).join('')||'<div class="empty">Aucune opération à afficher.</div>'}
function field(label,name,type,value='',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function select(label,name,values,value){return `<label>${label}<select name="${name}">${values.map(v=>`<option value="${esc(v[0])}" ${v[0]===value?'selected':''}>${esc(v[1])}</option>`).join('')}</select></label>`}
function modal(title,fields,submit){$('#mtitle').textContent=title;$('#fields').innerHTML=fields;$('#form').onsubmit=e=>{e.preventDefault();submit(Object.fromEntries(new FormData(e.target)))};$('#modal').showModal()}
function mutate(fn){if(loadError){toast('Restaurez une sauvegarde valide ou utilisez un navigateur avec stockage local.');return false}let next=JSON.parse(JSON.stringify(state));fn(next);if(!save(next))return false;render();return true}
function editVehicle(){let v=state.vehicle;modal('Votre véhicule',field('Marque et modèle','name','text',v.name,'required maxlength="80"')+field('Immatriculation','plate','text',v.plate,'maxlength="20"')+select('Motorisation','fuel',['Essence','Diesel','GPL','E85','Hybride essence','Électrique'].map(x=>[x,x]),v.fuel)+field('Kilométrage actuel','km','number',currentKm(),'required min="0" max="9999999" step="1"'),d=>{if(+d.km<Math.max(0,...state.entries.map(e=>e.km))){toast('Le kilométrage doit être au moins égal à celui des opérations.');return}if(!d.name.trim())return;if(mutate(s=>s.vehicle={...d,name:d.name.trim(),km:+d.km})){closeModal();toast('Véhicule enregistré')}})}
function editEntry(id){let e=state.entries.find(x=>x.id===id)||{type:'fuel',date:day(),km:currentKm(),cost:'',liters:'',title:'',energy:state.vehicle.fuel,notes:'',full:true};modal(id?'Modifier l’opération':'Une nouvelle étape',select('Type','type',[['fuel','Plein de carburant'],['service','Entretien / révision'],['other','Autre dépense']],e.type)+field('Date','date','date',e.date,`required max="${day()}"`)+field('Libellé / garage / station','title','text',e.title,'required maxlength="120" placeholder="Ex. Vidange et filtres"')+field('Compteur (km)','km','number',e.km,'required min="0" max="9999999" step="1"')+field('Montant total (€)','cost','number',e.cost,'required min="0" max="999999" step="0.01"')+`<div id="fuelFields" class="full formgrid">`+field('Volume (litres)','liters','number',e.liters,'min="0.01" max="2000" step="0.01"')+select('Carburant','energy',['Essence','Diesel','GPL','E85','Hybride essence'].map(x=>[x,x]),e.energy)+`<label class="full" style="display:flex;align-items:center"><input style="width:auto" name="full" type="checkbox" ${e.full?'checked':''}> Réservoir rempli complètement</label></div><label class="full">Notes<textarea name="notes" maxlength="2000" placeholder="Référence huile, pièces remplacées…">${esc(e.notes)}</textarea></label>`,d=>{let item={id:id||uid(),type:d.type,date:d.date,title:d.title.trim(),km:+d.km,cost:+d.cost,liters:d.type==='fuel'?+d.liters:0,energy:d.type==='fuel'?d.energy:'',full:d.type==='fuel'&&d.full==='on',notes:d.notes};if(!item.title)return;if(mutate(s=>{let i=s.entries.findIndex(x=>x.id===id);if(i<0)s.entries.push(item);else s.entries[i]=item})){closeModal();toast('Opération enregistrée')}});let t=$('[name=type]');function update(){$('#fuelFields').style.display=t.value==='fuel'?'grid':'none';$('[name=liters]').required=t.value==='fuel';$('[name=liters]').disabled=t.value!=='fuel'}t.onchange=update;update()}
function editReminder(id){let r=state.reminders.find(x=>x.id===id)||{title:'Contrôle technique',date:'',km:'',notes:'',done:false};modal(id?'Modifier l’échéance':'Garder une longueur d’avance',field('Intitulé','title','text',r.title,'required maxlength="120" list="suggestions"')+`<datalist id="suggestions"><option>Contrôle technique</option><option>Révision</option><option>Vidange</option><option>Pneus</option><option>Courroie de distribution</option><option>Assurance</option></datalist>`+field('Date limite (facultative)','date','date',r.date)+field('À faire avant (km, facultatif)','km','number',r.km??'','min="0" max="9999999" step="1"')+`<p class="sectionnote">Renseignez au moins une date ou un kilométrage.</p><label class="full">Notes<textarea name="notes" maxlength="2000">${esc(r.notes)}</textarea></label>`,d=>{if(!d.date&&d.km===''){toast('Indiquez une date ou un kilométrage.');return}if(!d.title.trim())return;let item={id:id||uid(),title:d.title.trim(),date:d.date,km:d.km===''?null:+d.km,notes:d.notes,done:r.done};if(mutate(s=>{let i=s.reminders.findIndex(x=>x.id===id);if(i<0)s.reminders.push(item);else s.reminders[i]=item})){closeModal();toast('Échéance enregistrée')}})}
function removeItem(list,id){if(confirm('Supprimer définitivement cet élément ?'))mutate(s=>s[list]=s[list].filter(e=>e.id!==id))}
function toggleReminder(id){mutate(s=>{let r=s.reminders.find(x=>x.id===id);r.done=!r.done})}
function download(name,content,type){let u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)}
function backup(){download('Octane_sauvegarde_'+day()+'.json',JSON.stringify(state,null,2),'application/json');toast('Sauvegarde préparée : conservez le fichier téléchargé.')}
$('#restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw Error();let s=JSON.parse(await f.text());if(!valid(s))throw Error();if(confirm(`Restaurer ${s.entries.length} opération(s), ${s.reminders.length} échéance(s) et ${(s.documents||[]).length} document(s) pour ${s.vehicle.name} ? Ceci remplace le carnet actuel.`)){if(save(s)){loadError=false;render();toast('Sauvegarde restaurée')}}}catch(err){toast('Fichier invalide : choisissez une sauvegarde JSON Octane.')}e.target.value=''};
function calendar(id){let r=state.reminders.find(r=>r.id===id),ce=s=>s.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;'),dt=r.date.replace(/-/g,'');download('Octane_echeance.ics',['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Octane//Carnet auto//FR','BEGIN:VEVENT','UID:'+r.id+'@octane.local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART;VALUE=DATE:'+dt,'SUMMARY:'+ce(r.title+' — '+state.vehicle.name),'DESCRIPTION:'+ce(r.notes+(r.km!==null?' · Échéance : '+r.km+' km':'')),'BEGIN:VALARM','TRIGGER:-P7D','ACTION:DISPLAY','DESCRIPTION:Rappel entretien véhicule','END:VALARM','END:VEVENT','END:VCALENDAR',''].join('\r\n'),'text/calendar');toast('Importez le fichier dans votre agenda pour activer le rappel.')}
let documentURL=null;
function addDocument(){if(loadError){toast('Le stockage local doit être disponible avant l’ajout.');return}$('#documentFile').click()}
$('#documentFile').onchange=async event=>{const file=event.target.files[0];event.target.value='';if(!file)return;if(file.size>1572864){toast('Fichier trop volumineux : maximum 1,5 Mo.');return}if(!file.size){toast('Ce fichier est vide.');return}try{let bytes=new Uint8Array(await file.slice(0,12).arrayBuffer()),mime='';if(bytes[0]===37&&bytes[1]===80&&bytes[2]===68&&bytes[3]===70&&bytes[4]===45)mime='application/pdf';else if(bytes[0]===255&&bytes[1]===216&&bytes[2]===255)mime='image/jpeg';else if(bytes[0]===137&&bytes[1]===80&&bytes[2]===78&&bytes[3]===71)mime='image/png';else if(String.fromCharCode(...bytes.slice(0,4))==='RIFF'&&String.fromCharCode(...bytes.slice(8,12))==='WEBP')mime='image/webp';if(!mime){toast('Format non pris en charge : PDF, JPG, PNG ou WebP.');return}const data=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve('data:'+mime+';base64,'+reader.result.split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});if((state.documents||[]).reduce((n,d)=>n+d.size,0)+file.size>2097152){toast('Limite de 2 Mo atteinte. Exportez une sauvegarde avant de libérer de la place.');return}if(mutate(s=>{s.documents=s.documents||[];s.documents.push({id:uid(),name:file.name.slice(0,200),date:day(),size:file.size,mime,data})})){toast('Document enregistré sur cet appareil.')}}catch(e){toast('Impossible de lire ce document. Réessayez avec un autre fichier.')}};
function documentBlob(d){let raw=atob(d.data.split(',')[1]),b=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)b[i]=raw.charCodeAt(i);return new Blob([b],{type:d.mime})}
function downloadDocument(id){let d=(state.documents||[]).find(x=>x.id===id);if(d)download(d.name,documentBlob(d),d.mime)}
function openDocument(id){let d=(state.documents||[]).find(x=>x.id===id);if(!d)return;closeDocument();documentURL=URL.createObjectURL(documentBlob(d));$('#docTitle').textContent=d.name;let el=document.createElement(d.mime==='application/pdf'?'iframe':'img');el.src=documentURL;if(d.mime==='application/pdf'){el.title=d.name;el.style.cssText='width:100%;height:60vh;border:0';el.setAttribute('sandbox','')}else{el.alt=d.name;el.style.cssText='max-width:100%;max-height:60vh;object-fit:contain'}$('#docContent').replaceChildren(el);$('#docDownload').onclick=()=>downloadDocument(id);$('#docViewer').showModal()}
function closeDocument(){$('#docViewer').close();$('#docContent').replaceChildren();if(documentURL){URL.revokeObjectURL(documentURL);documentURL=null}}
$('#docViewer').addEventListener('cancel',()=>closeDocument());
render();
</script></body></html>
